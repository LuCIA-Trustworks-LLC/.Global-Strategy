name: Security or governance change
description: Propose a controlled change without disclosing an active vulnerability
title: "[Governance] "
labels: ["governance", "needs-review"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose vulnerabilities or secrets here. Follow SECURITY.md."
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and affected controls
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk, rollback, and approvals
    validations:
      required: true
