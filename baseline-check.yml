on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-check:
    name: baseline-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check required governance files
        shell: main
        run: |
          set -euo pipefail

          required_files=(
            README.md
            AGENTS.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            legal/LICENSE-POLICY.md
          )

          failed=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              printf '必要なファイルが見つからないか、空です: %s\n' "$file" >&2
              failed=1
            fi
          done

          exit "$failed"
