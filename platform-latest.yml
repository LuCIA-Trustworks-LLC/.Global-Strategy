    HolderCaResponse:
      type: object
      description: A holder root CA certificate.
      required:
        - id
        - active
        - certificatePem
        - certificateFingerprint
        - certificateData
        - isManaged
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this holder root CA certificate.
          example: 281d20b3-42a3-40dd-b29a-115ff32b02b7
        active:
          type: boolean
          description: Whether this root is currently active. Only one root can be active per tenant at a time.
          example: true
        certificatePem:
          type: string
          description: The root CA certificate in PEM format.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
        certificateFingerprint:
          type: string
          description: SHA-256 fingerprint (hex) of the root certificate.
          example: a3b2c1d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890a1b2c3d4e5f67890
        certificateData:
          type: object
          description: Parsed metadata extracted from the certificate.
          required:
            - commonName
            - country
            - notAfter
            - notBefore
          properties:
            commonName:
              type: string
              description: Subject common name of the root certificate.
              example: Example Tenant Wallet Attestation Root
            country:
              type: string
              description: Subject country (ISO 3166-1 alpha-2).
              example: NZ
            notBefore:
              type: string
              format: date-time
              description: Certificate validity period start.
              example: '2026-04-06T00:00:00.000Z'
            notAfter:
              type: string
              format: date-time
              description: Certificate validity period end. For managed roots this is fixed at 10 years from `notBefore` and cannot be customised. For unmanaged roots this reflects the validity period of the customer-supplied certificate.
              example: '2036-04-06T00:00:00.000Z'
        isManaged:
          type: boolean
          description: Whether the private key for this root certificate is managed by MATTR VII (`true`) or externally by the customer (`false`).
          example: true
    HolderCaCreateRequestManaged:
      title: Managed holder root CA certificate
      type: object
      description: Payload for creating a managed holder root CA certificate. MATTR VII generates the P-256 key pair and self-signed certificate on the customer's behalf. The root is always created inactive — activate it via `PUT /v1/holder/certificates/ca/{certificateId}`.
      properties:
        commonName:
          type: string
          description: |
            Common name of the holder root CA certificate. Must be a valid `PrintableString` and cannot be an empty string if provided. If omitted, defaults to `"{tenantDomain} Wallet Attestation"` — the tenant's custom domain is used if configured and verified, otherwise the tenant subdomain.
          example: Example Tenant Wallet Attestation Root
        country:
          type: string
          description: |
            ISO 3166-1 alpha-2 country code for the root certificate's subject. If omitted, a tenant-level default is used.
          example: NZ
    HolderCaCreateRequestUnmanaged:
      title: Unmanaged holder root CA certificate
      type: object
      description: Payload for creating an unmanaged holder root CA certificate from an externally-managed PEM. `commonName` and `country` are extracted from the certificate and must not be provided. The root is always created inactive — activate it via `PUT /v1/holder/certificates/ca/{certificateId}`.
      required:
        - certificatePem
      properties:
        certificatePem:
          type: string
          description: Externally-managed root CA certificate in PEM format. Must be a valid, self-signed, non-expired X.509 certificate with `cA=true` basic constraints and `keyCertSign` + `cRLSign` key usage.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
    HolderCaUpdateRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: Whether the holder root CA certificate is active. Setting `true` deactivates all other roots for the tenant (single-active constraint).
          example: true
    WalletAttestationSignerResponse:
      title: Wallet attestation signer with certificate
      type: object
      description: A wallet attestation signer with a signed certificate. For managed signers, the certificate is auto-provisioned. For unmanaged signers, the certificate was uploaded via PUT.
      required:
        - id
        - caId
        - active
        - certificatePem
        - certificateFingerprint
        - certificateData
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this wallet attestation signer.
          example: 782f1885-c7c2-4459-8426-b6d7c111b0b1
        caId:
          type: string
          format: uuid
          description: Identifier of the holder root CA certificate this signer is issued from.
          example: 281d20b3-42a3-40dd-b29a-115ff32b02b7
        active:
          type: boolean
          description: Whether this signer is currently active. Only active signers with a valid certificate are used to sign wallet attestation JWTs.
          example: true
        certificatePem:
          type: string
          description: The signer certificate in PEM format.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
        certificateFingerprint:
          type: string
          description: SHA-256 fingerprint (hex) of the signer certificate.
          example: f6cad6e579d70b3973efa60624af731a580d1a11a7579e70f2f10f059dc86172
        certificateData:
          type: object
          description: Parsed metadata extracted from the signer certificate.
          required:
            - commonName
            - country
            - notAfter
            - notBefore
          properties:
            commonName:
              type: string
              description: Subject common name of the signer certificate.
              example: example.com Wallet Attestation Signer
            country:
              type: string
              description: Subject country (ISO 3166-1 alpha-2).
              example: NZ
            notBefore:
              type: string
              format: date-time
              description: Certificate validity period start.
              example: '2026-04-06T00:00:00.000Z'
            notAfter:
              type: string
              format: date-time
              description: Certificate validity period end. Managed signers default to 365 days from `notBefore`, clamped to the parent root's `notAfter`.
              example: '2027-04-06T00:00:00.000Z'
    CreateWalletAttestationSignerResponse:
      title: Wallet attestation signer without certificate
      type: object
      description: A wallet attestation signer prior to certificate upload. Includes the Certificate Signing Request (CSR) that must be externally signed.
      required:
        - id
        - caId
        - csrPem
        - active
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this wallet attestation signer.
          example: 782f1885-c7c2-4459-8426-b6d7c111b0b1
        caId:
          type: string
          format: uuid
          description: Identifier of the holder root CA certificate this signer is issued from.
          example: 281d20b3-42a3-40dd-b29a-115ff32b02b7
        csrPem:
          type: string
          description: X.509 Certificate Signing Request in PEM format. Sign this externally with the parent root and upload the resulting certificate via `PUT /v1/holder/certificates/wallet-attestation-signers/{certificateId}`.
          example: |-
            -----BEGIN CERTIFICATE REQUEST-----
            MIIC5zCCAc8CAQAwgaExC...
            -----END CERTIFICATE REQUEST-----
        active:
          type: boolean
          description: Always `false` prior to certificate upload.
          enum:
            - false
          example: false
    WalletAttestationSignerCreateRequest:
      type: object
      required:
        - caId
      properties:
        caId:
          type: string
          format: uuid
          description: |
            Identifier of the holder root CA certificate this signer will be issued from.
            - Must be an unmanaged root. Managed root signers are auto-provisioned and cannot be created via this endpoint.
          example: 281d20b3-42a3-40dd-b29a-115ff32b02b7
    WalletAttestationSignerUpdateRequest:
      type: object
      description: |
        Payload for updating a wallet attestation signer. Can be used to upload the signed certificate PEM (first-time upload only) and/or toggle the `active` flag.
      properties:
        active:
          type: boolean
          description: |
            Whether the wallet attestation signer is active. Only signers with an uploaded certificate PEM can be activated.

            Multiple active signers may exist for the same root (e.g. during a rotation where a new signer has been created but the old one is still trusted by relying parties). When more than one active signer exists for the active root, attestation signing always selects the most recently created one.
          example: true
        certificatePem:
          type: string
          description: |
            Signed certificate PEM for an unmanaged signer whose CSR has been externally signed. Must match the signer's CSR public key and be signed by the parent root certificate. Other certificate properties (key usage, extensions, validity period) are inherited from the CSR or set by the issuing CA.

            This field is immutable after the first upload — subsequent requests with `certificatePem` will return `400 CannotOverrideCertificatePem`.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
