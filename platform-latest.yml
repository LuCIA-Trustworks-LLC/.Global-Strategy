        * ECOSYSTEM_RICAL_RETRIEVE_LATEST_FAIL
      operationId: getLatestRical
      responses:
        '200':
          description: RICAL retrieved
          headers:
            Content-Type:
              description: The media type of the file
              schema:
                type: string
                example: application/cbor
            Content-Disposition:
              description: Indicates file attachment
              schema:
                type: string
                example: attachment; filename="rical-2024-07-28-1722164473000.cbor"
            Content-Length:
              description: The size of the file in bytes
              schema:
                type: number
                example: 1843
          content:
            application/cbor:
