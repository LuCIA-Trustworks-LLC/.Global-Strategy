    DtsCaResponse:
      type: object
      required:
        - id
        - active
        - certificatePem
        - certificateFingerprint
        - certificateData
        - isManaged
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this DTS root CA certificate.
          example: 782f1885-c7c2-4459-8426-b6d7c111b0b1
        active:
          type: boolean
          description: |
            Indicates whether the DTS root CA certificate is active. Activating a certificate does not affect your ability to create or sign subordinate (intermediate CA or signer) certificates: you can build a complete certificate chain while the root CA is inactive. Instead, active certificates are included in the selection process MATTR VII uses when choosing the certificate chain to sign a trusted list (VICAL or RICAL), where MATTR VII prefers the most recently created active certificate at each level of the chain. Only one DTS root CA certificate can be active at a time.
          example: true
        certificatePem:
          type: string
          description: DTS root CA certificate in PEM format.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
        certificateFingerprint:
          type: string
          description: SHA-256 hash of DTS root CA certificate content.
          example: f6cad6e579d70b3973efa60624af731a580d1a11a7579e70f2f10f059dc86172
        certificateData:
          type: object
          required:
            - commonName
            - country
            - notAfter
            - notBefore
            - organisationName
          properties:
            commonName:
              type: string
              description: The common name of the DTS root CA certificate.
              example: example.com
            country:
              type: string
              description: The country associated with the DTS root CA certificate.
              example: US
            organisationName:
              type: string
              description: The organization associated with the DTS root CA certificate.
              example: Example Inc.
            notAfter:
              type: string
              format: date-time
              description: The DTS root CA certificate's expiration date and time.
              example: '2024-10-22T00:00:00Z'
            notBefore:
              type: string
              format: date-time
              description: The DTS root CA certificate's validity period start date and time.
              example: '2023-10-22T00:00:00Z'
        isManaged:
          type: boolean
          description: Indicates whether the private key for this DTS root CA certificate is managed by MATTR (`true`) or out of band by the customer as an external certificate (`false`).
          example: true
        useIntermediateCa:
          type: boolean
          description: When `true`, this DTS root CA certificate uses the 3-tier certificate model, requiring and using DTS intermediate CA certificates as part of its chain of trust for signing operations. When `false`, the 2-tier model is used and the DTS root CA signs signer certificates directly. For an explanation of the 2-tier and 3-tier models, refer to the [DTS certificates overview](https://learn.mattr.global/docs/digital-trust-service/certificates-overview#certificate-models-2-tier-and-3-tier).
          example: true
    DtsCaCreateRequestManaged:
      title: Managed DTS root CA certificate
      type: object
      required:
        - organisationName
      properties:
        commonName:
          type: string
          description: Indicates the common name of the DTS root CA certificate. When specified, the value must be a valid `PrintableString` and cannot be an empty string. If not provided and a custom domain is configured and verified, the custom domain is used followed by the words `DTS CA`. If no custom domain is configured, the tenant subdomain is used instead.
          example: example.com
        country:
          type: string
          description: Indicates the DTS provider's country. If not provided, a country is selected based on the region of the tenant subdomain cloud host. When specified, the value must be a valid [Alpha 2 country code](https://www.iso.org/glossary-for-iso-3166.html) as per [ISO 3166-1](https://www.iso.org/standard/72482.html).
          example: US
        organisationName:
          type: string
          description: Indicates the organization associated with the DTS root CA certificate.
          example: Example Inc.
        notAfter:
          type: string
          format: date-time
          description: |
            Used to set the date and time when the DTS root CA certificate expires.
            - If not provided, calculated as `notBefore` + 20 years.
            - If not provided and `notBefore` is not provided, calculated as time of creation + 20 years.
            - Maximum value is 20 years from creation.
            - Must be after `notBefore`, if provided.
          example: '2024-10-22T00:00:00Z'
        notBefore:
          type: string
          format: date-time
          description: |
            Used to set the date and time when the DTS root CA certificate becomes valid and can be used to sign other intermediate certificates.
            - Must not be in the past.
            - Must be before `notAfter`.
          example: '2023-10-22T00:00:00Z'
    DtsCaCreateRequestUnmanaged:
      title: Unmanaged DTS root CA certificate
      type: object
      required:
        - certificatePem
      properties:
        certificatePem:
          type: string
          description: DTS root CA certificate in PEM format. The certificate must be valid and not expired.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
        useIntermediateCa:
          type: boolean
          description: When `true`, this DTS root CA certificate uses the 3-tier certificate model, requiring and using DTS intermediate CA certificates as part of its chain of trust for signing operations. When `false` (the default), the 2-tier model is used and the DTS root CA signs signer certificates directly. This field can only be set for unmanaged (external) DTS root CA certificates. For an explanation of the 2-tier and 3-tier models, refer to the [DTS certificates overview](https://learn.mattr.global/docs/digital-trust-service/certificates-overview#certificate-models-2-tier-and-3-tier).
          example: true
          default: false
    dtsCaCertificateId:
      description: Unique identifier of the DTS root CA certificate.
      type: string
      format: uuid
      example: b0aae560-10e7-4247-8e96-7cdd3578a1e2
    DtsCaUpdateRequest:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: |
            Indicates whether the DTS root CA certificate is active. Activating a certificate does not affect your ability to create or sign subordinate (intermediate CA or signer) certificates: you can build a complete certificate chain while the root CA is inactive. Instead, active certificates are included in the selection process MATTR VII uses when choosing the certificate chain to sign a trusted list (VICAL or RICAL), where MATTR VII prefers the most recently created active certificate at each level of the chain. Only one DTS root CA certificate can be active at a time.
          example: true
        useIntermediateCa:
          type: boolean
          description: When `true`, this DTS root CA certificate uses the 3-tier certificate model, requiring and using DTS intermediate CA certificates as part of its chain of trust for signing operations. When `false`, the 2-tier model is used and the DTS root CA signs signer certificates directly. Changing this value requires deleting all subordinate certificates. This field can only be set for unmanaged (external) DTS root CA certificates. For an explanation of the 2-tier and 3-tier models, refer to the [DTS certificates overview](https://learn.mattr.global/docs/digital-trust-service/certificates-overview#certificate-models-2-tier-and-3-tier).
          example: true
    DtsCaPublicResponse:
      type: object
