        certificateFingerprint:
          type: string
          description: SHA-256 hash fingerprint of the link certificate.
          example: 57B178A6C2B8C1877DBA515AD4FD60F9C805EFC309287182DB7DEBFE43A22928
    IssuerCertificateResponse:
