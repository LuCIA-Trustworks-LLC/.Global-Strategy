        * USER_RETRIEVE_LIST_START
        * USER_RETRIEVE_LIST_SUCCESS
        * USER_RETRIEVE_LIST_FAIL
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Users retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsersResponse'
        '400':
          $ref: '#/components/responses/400'
    parameters: []
  /v1/users/{id}:
    parameters:
      - name: id
        in: path
        description: User ID
        schema:
          type: string
          format: uuid
          example: 8241400f-de3b-42c5-ad7c-8a380039e796
        required: true
    get:
      operationId: getUser
      tags:
        - Users
      summary: Retrieve a user
      x-roles:
        - admin
        - issuer
        - managed-issuer
      description: |-
        Retrieve an existing user by providing its ID.
        * USER_RETRIEVE_START
        * USER_RETRIEVE_SUCCESS
        * USER_RETRIEVE_FAIL
      responses:
        '200':
          description: User retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
    put:
      operationId: updateUser
      tags:
        - Users
      summary: Update a User
      x-roles:
        - admin
        - issuer
        - managed-issuer
      description: |-
        Updates an existing user by providing its ID.

        * USER_UPDATE_START
        * USER_UPDATE_SUCCESS
        * USER_UPDATE_FAIL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        description: Update a User
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
    delete:
      operationId: deleteUser
      tags:
        - Users
      summary: Delete a user
      x-roles:
        - admin
        - issuer
        - managed-issuer
      description: |-
        Deletes a user and removes all data related to them by providing the user ID.

        <Callout type="warning">
        Deleting a user is irreversible. All of the user's data is removed, and any credential previously issued to them is no longer valid.
        </Callout>

        ### **Analytic events**
        * USER_DELETE_START
        * USER_DELETE_SUCCESS
        * USER_DELETE_FAIL
      responses:
        '204':
          description: User deleted
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
