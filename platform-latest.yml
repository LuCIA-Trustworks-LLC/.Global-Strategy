    LinkCertificateInfoRequest:
      type: object
      description: |-
        Links this certificate to a previously uploaded certificate as its
        successor, maintaining trust continuity across a certificate rotation.

        When provided, the new certificate is added as a successor to the
        previously uploaded certificate identified by `issuerCertificateId`, and
        the supplied link certificate ties the two together. The link certificate
        must chain to that predecessor certificate.
