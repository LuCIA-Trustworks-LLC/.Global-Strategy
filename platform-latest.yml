        certificatePem:
          type: string
          description: The PEM-encoded issuer certificate.
          example: "-----BEGIN CERTIFICATE-----\r\nMIIBwzCCAWigAwIBAgIKRGC+CqoTGJKkkTAKBggqhkjOPQQDAjAgMR4wCQYDVQQG\r\n-----END CERTIFICATE-----\r\n"
        certificateFingerprint:
