        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required:
              - msg
              - param
              - location
            properties:
              value:
                type: string
                description: The value that was provided
              msg:
                type: string
                example: Invalid value
                description: Description of why the request is invalid
              param:
                type: string
