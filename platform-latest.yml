                      example: |-
                        -----BEGIN CERTIFICATE-----
                        MIIDXTCCAkWgAwIBAgIJAL5...
                        -----END CERTIFICATE-----
                    notBefore:
                      type: string
                      format: date-time
                      description: The DTS intermediate CA certificate's validity period start date and time.
                      example: '2023-10-22T00:00:00Z'
                    notAfter:
                      type: string
                      format: date-time
                      description: The DTS intermediate CA certificate's expiration date and time.
                      example: '2024-10-22T00:00:00Z'
                    fingerprint:
                      type: string
                      description: SHA-256 hash of DTS intermediate CA certificate content.
                      example: f6cad6e579d70b3973efa60624af731a580d1a11a7579e70f2f10f059dc86172
                    commonName:
                      type: string
                      description: The common name of the DTS intermediate CA certificate.
                      example: MATTR DTS Intermediate CA
    DtsIntermediateCaResponse:
      type: object
