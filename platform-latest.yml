              type: string
              format: date-time
              description: VSC validity period start date and time.
              example: '2023-10-22T00:00:00Z'
        caId:
          type: string
          format: uuid
          description: Unique identifier of the DTS root CA certificate used as a trust anchor for the VICAL signer.
          example: b0aae560-10e7-4247-8e96-7cdd3578a1e2
        intermediateCaId:
          type: string
          format: uuid
          description: Unique identifier of the DTS intermediate CA certificate used to sign the VICAL signer.
