          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWalletAttestationSignerResponse'
        '400':
          description: Bad request. The request was malformed, missing required parameters, or the target root is managed (managed signers are auto-provisioned and cannot be created via this endpoint).
