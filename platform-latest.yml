          example: 782f1885-c7c2-4459-8426-b6d7c111b0b1
        csrPem:
          type: string
          description: The X.509 Certificate Signing Request (CSR) in PEM format, base64 encoded. Use this CSR to generate a valid certificate, then update the VICAL signer with the resulting certificate.
          example: |-
            -----BEGIN CERTIFICATE REQUEST-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE REQUEST-----
        caId:
          type: string
          format: uuid
          description: Unique identifier of the DTS root CA certificate used as a trust anchor for the VICAL signer.
          example: b0aae560-10e7-4247-8e96-7cdd3578a1e2
        intermediateCaId:
          type: string
          format: uuid
          description: Unique identifier of the DTS intermediate CA certificate used to sign the VICAL signer.
          example: b0aae560-10e7-4247-8e96-7cdd3578a1e2
        active:
          type: boolean
          description: |
            Indicates whether the VICAL signer is active.
            - Active VICAL signers are included in the selection process MATTR VII uses when choosing the signer to sign a VICAL, where MATTR VII prefers the most recently created active VICAL signer.
            - VICAL signers are created as inactive by default, and can only be set to active once a VICAL Signer Certificate (VSC) has been associated with them.
