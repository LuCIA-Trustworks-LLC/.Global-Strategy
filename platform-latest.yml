        * PRESENTATION_WEB_SEMANTIC_VERIFY_SUCCESS
        * PRESENTATION_WEB_SEMANTIC_VERIFY_FAIL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiablePresentation'
        description: Presentation to verify
    parameters: []
