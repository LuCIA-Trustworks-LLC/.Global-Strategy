          example: true
        certificatePem:
          type: string
          description: VICAL Signer Certificate (VSC) in PEM format.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIDXTCCAkWgAwIBAgIJAL5...
            -----END CERTIFICATE-----
        certificateFingerprint:
          type: string
          description: SHA-256 hash of all VSC certificate data and signature.
