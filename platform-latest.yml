    IssuerValidationResult:
      oneOf:
        - type: object
          required:
            - validated
          properties:
            validated:
              type: boolean
              enum:
                - true
              example: true
        - type: object
          required:
            - validated
            - failReasons
          properties:
            validated:
              type: boolean
              enum:
                - false
              example: false
            failReasons:
              type: array
              description: |
                A list of validation failure reasons, present only when `validated` is `false`. Possible values are:
                * `Certificate PEM is invalid`: the certificate PEM could not be parsed.
                * `Certificate has expired`: the certificate's validity period has ended.
                * `Certificate status is Inactive`: the certificate's status is `Inactive`.
                * `Certificate status is Delisted`: the certificate's status is `Delisted`.
                * `No docTypes are assigned to the issuer certificate`: the issuer certificate has no document types assigned.
