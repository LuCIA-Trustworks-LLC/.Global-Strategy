    CreateVicalSignerResponse:
      title: VICAL Signer without certificate
      description: VICAL signer before a VICAL Signer Certificate (VSC) has been uploaded. Includes the Certificate Signing Request (CSR).
      type: object
      required:
        - id
        - csrPem
